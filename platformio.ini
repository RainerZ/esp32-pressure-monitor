; ESP32 Pressure Monitor
;
; Publishes calibrated pressure via MQTT once per second, while XCP on Ethernet
; allows real-time observation of the same signals at task rate (down to 1 ms).
;
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

extra_scripts =
    pre:extra_script.py
    post:extra_linker_script.py

build_flags =
    ; Vendored XCPlite subset, see xcplite/VERSION and tools/update_xcplite.sh
    -Ixcplite/inc
    -Ixcplite/src
    -D_FREE_RTOS
    -DXCPLITE_CONFIGURATION=rtos
    -DXCPLIB_CFG_OVERRIDE=\"xcplib_rtos_cfg.h\"

    ; Hardware options. Disable OPTION_DISPLAY and drop LovyanGFX from lib_deps
    ; on a board without the LilyGo T-Display-S3 LCD.
    -DOPTION_DISPLAY
    -DOPTION_IO
    ;-DOPTION_ANALOG
    -DOPTION_MQTT
    ; Home Assistant MQTT discovery plus an availability topic with last will,
    ; see docs/HOME_ASSISTANT.md. Needs OPTION_MQTT.
    -DOPTION_MQTT_DISCOVERY
    ; Receive path for the MQTT task. With it, discovery re-announces on Home
    ; Assistant's birth message instead of leaving a retained config on the
    ; broker. Drop it for a publish-only node.
    -DOPTION_MQTT_SUBSCRIBE
    ; Real-time measurement and live calibration over XCP on Ethernet.
    ; Drop this for a plain MQTT node: no XCPlite is compiled or linked, and
    ; the vendored xcplite/ sources are not even needed.
    -DOPTION_XCP

    ; MQTT broker. The built-in default is mqtt.local, which needs mDNS
    ; resolution; a literal address avoids that lookup entirely.
    -DMQTT_BROKER_HOST=\"192.168.8.135\"
    ; -DMQTT_BROKER_PORT=1883
    ; -DMQTT_TOPIC=\"pressure_monitor/measurement\"
    ; -DMQTT_PAYLOAD_MAX_LENGTH=160
    ; Discovery: topic for "online"/"offline", and the device name shown in
    ; Home Assistant. Give each board its own MQTT_TOPIC and availability topic.
    ; -DMQTT_AVAILABILITY_TOPIC=\"pressure_monitor/status\"
    ; -DMQTT_DISCOVERY_DEVICE_NAME=\"Pressure monitor\"
    ; Power-on default for the publish period and averaging window. This sets
    ; the calibration reference page; XCP can still retune it at runtime, and
    ; the runtime value is lost on reset. Must stay within 100..3600000 ms.
    -DMQTT_PUBLISH_PERIOD_MS=1000
    ; Optional authentication (define both):
    ; -DMQTT_USERNAME=\"user\"
    ; -DMQTT_PASSWORD=\"password\"

    ; WiFi credentials. Set them here, or copy src/wlan.h.example to
    ; src/wlan.h (gitignored) and edit that instead.
    ; -DWIFI_SSID=\"your-ssid\"
    ; -DWIFI_PASSWORD=\"your-password\"

upload_port = /dev/cu.usbmodem101
upload_speed = 460800
monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    knolleary/PubSubClient @ ^2.8
